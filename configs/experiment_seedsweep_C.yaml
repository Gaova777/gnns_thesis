# Experiment config — seed sweep GAT/TAGCN (corrido en la 4060 por falta de acceso a la 3050)
# Clon de experiment_seedsweep.yaml con las dos arquitecturas pesadas.
# Se usa con train_matrix.py --reuse-hp (reutiliza HP de seed 42; salta Optuna) y
# explain_matrix.py --explainer GNNShap. Escribe al MISMO CSV del sweep (results_seedsweep).

data:
  root: "./data"
  train_timesteps: [1, 34]
  val_timesteps: [35, 42]
  test_timesteps: [43, 49]

scenarios:
  imbalance_ratios:
    - name: "1:1"
      illicit_to_licit: 1.0
    - name: "1:10"
      illicit_to_licit: 0.1
    - name: "1:30_native"
      illicit_to_licit: null
    - name: "1:50"
      illicit_to_licit: 0.02
    - name: "1:100"
      illicit_to_licit: 0.01

models:
  architectures:
    - name: "GAT"
      class: "src.models.gat.GAT"
    - name: "TAGCN"
      class: "src.models.tagcn.TAGCN"

  hyperparameter_search:
    hidden_dim: [64, 128, 148]                # cap 148 (igual que config C; no se usa bajo --reuse-hp)
    num_layers: [2, 3]
    dropout: [0.1, 0.5]
    learning_rate: [0.0001, 0.01]
    weight_decay: [0.00001, 0.001]
    optuna_trials: 8
    optuna_metric: "pr_auc"
    warm_start: true

training:
  epochs: 150                                 # igual que config C (GAT/TAGCN)
  patience: 20
  early_stop_metric: "f1"
  optimizer: "adam"
  batch_size: null
  seeds: [42]

balancing:
  techniques:
    - name: "none"
    - name: "class_weighting"
    - name: "focal_loss"
      gamma: 2.0
      alpha: 0.75

explainability:
  methods:
    - name: "GNNExplainer"
      epochs: 100
      lr: 0.01
    - name: "PGExplainer"
      epochs: 100
      lr: 0.001
      nan_abort_threshold: 2
    - name: "GNNShap"
      num_samples: 50                         # igual que el sweep de B, para comparabilidad entre semillas

  nodes_per_class: 30

stability:
  num_replicas: 5
  noise_levels: [0.01, 0.05, 0.10]
  top_k_edges: 20
  top_k_features: 20

analysis:
  quality_gate:
    f1_min: 0.30
    mcc_min: 0.15
  thresholds:
    f1_min: 0.80
    mcc_min: 0.70
    jaccard_min: 0.70
  bootstrap_samples: 1000
  confidence_level: 0.95

tracking:
  backend: "mlflow"
  experiment_name: "xai-gnn-stability-seedsweep"
  results_dir: "./results_seedsweep"
  models_dir: "./results_models_v3"
